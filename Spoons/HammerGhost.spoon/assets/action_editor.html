<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Action Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="action-editor">
        <h2>Action Editor</h2>
        <form id="action-form">
            <input type="hidden" id="action-id">
            <div class="form-group">
                <label for="action-name">Name</label>
                <input type="text" id="action-name" required>
            </div>
            <div class="form-group">
                <label for="action-type">Type</label>
                <select id="action-type">
                    <!-- Action types will be populated dynamically -->
                </select>
            </div>
            <div id="action-parameters">
                <!-- Action parameters will be populated here -->
            </div>
            <div class="form-buttons">
                <button type="submit" class="primary">Save Action</button>
                <button type="button" id="cancel-action">Cancel</button>
            </div>
        </form>
    </div>
    <script src="param_widgets.js"></script>
    <script src="action_editor.js"></script>
</body>
</html>
