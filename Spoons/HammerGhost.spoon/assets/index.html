<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HammerGhost</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="app-header">
        <span id="app-title">HammerGhost</span>
        <span id="item-count"><!-- Item count injected here --></span>
    </header>
    <div id="main">
        <div id="tree-column">
            <div id="tree-search-bar">
                <input id="tree-search" type="text" placeholder="Filter macros…" autocomplete="off" spellcheck="false">
                <button id="tree-search-clear" title="Clear filter">✕</button>
            </div>
            <div id="tree-container">
                <!-- Tree content will be injected here -->
            </div>
        </div>
        <div id="divider" title="Drag to resize"></div>
        <div id="properties-panel">
            <!-- Properties content will be injected here -->
        </div>
    </div>
    <section id="log-panel">
        <div id="log-header">
            <span>Event Log</span>
            <button id="log-clear" title="Clear log">Clear</button>
        </div>
        <div id="log-entries">
            <!-- Log entries injected here -->
        </div>
    </section>
    <div id="tree-context-menu" class="context-menu" role="menu"></div>
    <script src="param_widgets.js"></script>
    <script src="app.js"></script>
</body>
</html>
