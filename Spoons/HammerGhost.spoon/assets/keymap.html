<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Keymap</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Keymap editor. Inherits the palette tokens from styles.css
           (--bg-color, --text-color, --accent-color, ...) so it matches the rest
           of HammerGhost; everything below is scoped to .km- classes. */
        body {
            margin: 0;
            overflow: hidden;
        }

        .km-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-size: 13px;
        }

        /* ── header ─────────────────────────────────────────────────────── */
        .km-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            flex: 0 0 auto;
        }

        .km-title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
        }

        .km-search {
            flex: 1 1 auto;
            min-width: 80px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 5px 9px;
            font-size: 12px;
        }

        .km-search:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .km-stats {
            color: var(--muted-color);
            font-size: 11px;
            white-space: nowrap;
        }

        .km-stats .km-warn {
            color: #e5a33a;
        }

        /* ── layer tabs ─────────────────────────────────────────────────── */
        .km-layers {
            display: flex;
            gap: 6px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border-color);
            flex: 0 0 auto;
            flex-wrap: wrap;
        }

        .km-layer {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 5px 11px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .km-layer:hover {
            background: var(--hover-color);
        }

        .km-layer.km-active {
            background: var(--selected-color);
            border-color: var(--accent-color);
        }

        .km-layer .km-glyph {
            font-size: 13px;
        }

        .km-layer .km-count {
            color: var(--muted-color);
            font-size: 10px;
        }

        /* ── keyboard grid ──────────────────────────────────────────────── */
        .km-board {
            flex: 1 1 auto;
            overflow: auto;
            padding: 14px;
            /* One keyboard unit. The widest row is 17u (the arrow cluster
               overhangs, as it does on a real board), which fits this window. */
            --ku: 58px;
            --kgap: 6px;
        }

        .km-row {
            display: flex;
            gap: var(--kgap);
            margin-bottom: var(--kgap);
        }

        .km-row.km-gap {
            margin-top: 14px;
        }

        .km-key {
            /* Width in keyboard units: N caps plus the gaps they span, so a 2u
               key lines up exactly with the two 1u keys above it. */
            width: calc(var(--ku) * var(--w, 1) + var(--kgap) * (var(--w, 1) - 1));
            flex: 0 0 auto;
            /* Fixed, not min-: every cap in a row must be the same height or
               the board stops reading as a keyboard. */
            height: 70px;
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 5px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            text-align: left;
            color: var(--text-color);
            font-family: inherit;
        }

        .km-key:hover {
            background: var(--hover-color);
            border-color: var(--accent-color);
        }

        .km-key.km-selected {
            background: var(--selected-color);
            border-color: var(--accent-color);
        }

        .km-key .km-cap {
            font-weight: 600;
            font-size: 12px;
            flex: 0 0 auto;
        }

        .km-key .km-desc {
            font-size: 10px;
            line-height: 1.2;
            color: var(--muted-color);
            overflow: hidden;
            /* Three lines is enough for the longest descriptions in use
               ("Toggle Between Location 1 and 2") without stretching the row. */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        /* State colours. Free keys stay flat so the eye goes to what IS bound —
           the point of the grid is spotting free slots and collisions at once. */
        .km-key.km-free {
            opacity: 0.4;
        }

        .km-key.km-bound .km-desc {
            color: var(--text-color);
        }

        .km-key.km-placeholder .km-desc {
            font-style: italic;
            opacity: 0.65;
        }

        .km-key.km-disabled {
            opacity: 0.5;
        }

        .km-key.km-disabled .km-cap {
            text-decoration: line-through;
        }

        .km-key.km-broken {
            border-color: #d9534f;
        }

        .km-key.km-broken .km-desc {
            color: #e57373;
        }

        .km-key.km-dimmed {
            opacity: 0.12;
        }

        .km-key .km-badge {
            font-size: 9px;
        white-space: nowrap;
            color: var(--muted-color);
            margin-top: auto;
        }

        .km-spacer {
            flex: 0 0 auto;
            width: calc(var(--ku) * var(--w, 1) + var(--kgap) * (var(--w, 1) - 1));
        }

        /* Structural keys: the modifiers this grid is layered on, drawn so the
           board reads as a keyboard. Not bindable, so not interactive. */
        .km-mod {
            cursor: default;
            opacity: 0.4;
        }

        .km-mod .km-cap {
            font-weight: 400;
        }

        /* ── detail panel ───────────────────────────────────────────────── */
        .km-detail {
            flex: 0 0 auto;
            border-top: 1px solid var(--border-color);
            padding: 12px 14px;
            max-height: 46vh;
            overflow: auto;
            background: var(--bg-color);
        }

        .km-empty {
            color: var(--muted-color);
            font-size: 12px;
            padding: 4px 0;
        }

        .km-detail-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .km-combo {
            font-weight: 600;
            font-size: 13px;
        }

        .km-field {
            margin-bottom: 9px;
        }

        .km-field label {
            display: block;
            font-size: 11px;
            color: var(--muted-color);
            margin-bottom: 3px;
        }

        .km-field input[type="text"],
        .km-field select,
        .km-field textarea {
            width: 100%;
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 5px 8px;
            font-size: 12px;
            font-family: inherit;
        }

        .km-field textarea {
            font-family: Menlo, monospace;
            font-size: 11px;
            resize: vertical;
            min-height: 46px;
        }

        .km-field input:focus,
        .km-field select:focus,
        .km-field textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .km-cols {
            display: flex;
            gap: 10px;
        }

        .km-cols > * {
            flex: 1 1 0;
            min-width: 0;
        }

        .km-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .km-note {
            font-size: 11px;
            color: var(--muted-color);
            background: var(--input-bg);
            border-left: 2px solid var(--border-color);
            padding: 6px 9px;
            margin-bottom: 9px;
            line-height: 1.4;
        }

        .km-note.km-note-error {
            border-left-color: #d9534f;
            color: #e57373;
        }

        .km-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 11px;
        }

        .km-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 6px 14px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }

        .km-btn:hover {
            background: var(--hover-color);
        }

        .km-btn.km-primary {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .km-btn.km-primary:hover {
            background: var(--accent-hover);
        }

        .km-btn.km-danger:hover {
            background: #5a2020;
            border-color: #d9534f;
        }

        .km-status {
            font-size: 11px;
            color: var(--muted-color);
            margin-left: auto;
        }

        .km-hide {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="km-app">
    <div class="km-header">
        <span class="km-title">⌘ Keymap</span>
        <input type="text" id="km-search" class="km-search" placeholder="Filter by description, key or function…">
        <span class="km-stats" id="km-stats"></span>
    </div>

    <div class="km-layers" id="km-layers"></div>

    <div class="km-board" id="km-board"></div>

    <div class="km-detail" id="km-detail">
        <div class="km-empty">Select a key to see or change what it does.</div>
    </div>
</div>

<script src="keymap_transport_hs.js"></script>
<script src="keymap.js"></script>
</body>
</html>
