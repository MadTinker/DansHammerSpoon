<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Keymap</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Keymap editor. Inherits the palette tokens from styles.css
           (--bg-color, --text-color, --accent-color, ...) so it matches the rest
           of HammerGhost; everything below is scoped to .km- classes. */
        body {
            margin: 0;
            overflow: hidden;
        }

        .km-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-size: 13px;
        }

        /* ── header ─────────────────────────────────────────────────────── */
        .km-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            flex: 0 0 auto;
        }

        .km-title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
        }

        .km-search {
            flex: 1 1 auto;
            min-width: 80px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 5px 9px;
            font-size: 12px;
        }

        .km-search:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .km-stats {
            color: var(--muted-color);
            font-size: 11px;
            white-space: nowrap;
        }

        .km-stats .km-warn {
            color: #e5a33a;
        }

        /* ── layer tabs ─────────────────────────────────────────────────── */
        .km-layers {
            display: flex;
            gap: 6px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border-color);
            flex: 0 0 auto;
            flex-wrap: wrap;
        }

        .km-layer {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 5px 11px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .km-layer:hover {
            background: var(--hover-color);
        }

        .km-layer.km-active {
            background: var(--selected-color);
            border-color: var(--accent-color);
        }

        .km-layer .km-glyph {
            font-size: 13px;
        }

        .km-layer .km-count {
            color: var(--muted-color);
            font-size: 10px;
        }

        /* ── keyboard grid ──────────────────────────────────────────────── */
        .km-board {
            flex: 1 1 auto;
            overflow: auto;
            padding: 14px;
            /* One keyboard unit. The widest row is 17u (the arrow cluster
               overhangs, as it does on a real board), which fits this window. */
            /* Starting value only: keymap.js overwrites it on this element
               to fit the current width. */
            --ku: 58px;
            --kgap: 6px;
        }

        .km-row {
            display: flex;
            gap: var(--kgap);
            margin-bottom: var(--kgap);
        }

        .km-row.km-gap {
            margin-top: 14px;
        }

        .km-key {
            /* Width in keyboard units: N caps plus the gaps they span, so a 2u
               key lines up exactly with the two 1u keys above it. */
            width: calc(var(--ku) * var(--w, 1) + var(--kgap) * (var(--w, 1) - 1));
            flex: 0 0 auto;
            /* Fixed, not min-: every cap in a row must be the same height or
               the board stops reading as a keyboard. */
            /* Derived from --ku so a wider board grows taller caps instead
               of leaving a dead band under the keyboard. */
            height: calc(var(--ku) * 1.2);
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 5px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            text-align: left;
            color: var(--text-color);
            font-family: inherit;
        }

        .km-key:hover {
            background: var(--hover-color);
            border-color: var(--accent-color);
        }

        .km-key.km-selected {
            background: var(--selected-color);
            border-color: var(--accent-color);
        }

        .km-key .km-cap {
            /* Scales with the cap; clamped so tiny boards stay legible and huge
               ones do not turn into billboards. */
            font-size: clamp(10px, calc(var(--ku) * 0.21), 17px);
            font-weight: 600;
            font-size: 12px;
            flex: 0 0 auto;
        }

        .km-key .km-desc {
            font-size: clamp(9px, calc(var(--ku) * 0.17), 14px);
            font-size: 10px;
            line-height: 1.2;
            color: var(--muted-color);
            overflow: hidden;
            /* Three lines is enough for the longest descriptions in use
               ("Toggle Between Location 1 and 2") without stretching the row. */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        /* State colours. Free keys stay flat so the eye goes to what IS bound —
           the point of the grid is spotting free slots and collisions at once. */
        .km-key.km-free {
            background: transparent;
            border-style: dashed;
            border-bottom-width: 1px;
            box-shadow: none;
        }

        .km-key.km-free .km-cap { color: var(--muted-color); font-weight: 400; }

        .km-key.km-bound .km-desc {
            color: var(--text-color);
        }

        .km-key.km-placeholder .km-desc {
            font-style: italic;
            opacity: 0.65;
        }

        .km-key.km-disabled {
            opacity: 0.5;
        }

        .km-key.km-disabled .km-cap {
            text-decoration: line-through;
        }

        .km-key.km-broken {
            border-color: #d9534f;
        }

        .km-key.km-broken .km-desc {
            color: #e57373;
        }

        .km-key.km-dimmed {
            opacity: 0.12;
        }

        .km-key .km-badge {
            font-size: 9px;
        white-space: nowrap;
            color: var(--muted-color);
            margin-top: auto;
        }

        .km-spacer {
            flex: 0 0 auto;
            width: calc(var(--ku) * var(--w, 1) + var(--kgap) * (var(--w, 1) - 1));
        }

        /* Structural keys: the modifiers this grid is layered on, drawn so the
           board reads as a keyboard. Not bindable, so not interactive. */
        .km-mod {
            cursor: default;
            background: transparent;
            border-style: solid;
            border-color: var(--border-color);
            border-bottom-width: 1px;
            box-shadow: none;
        }

        .km-mod .km-cap { color: var(--muted-color); }

        .km-mod .km-cap {
            font-weight: 400;
        }

        /* ── detail panel ───────────────────────────────────────────────── */
        .km-detail {
            flex: 0 0 auto;
            border-top: 1px solid var(--border-color);
            padding: 12px 14px;
            max-height: 46vh;
            overflow: auto;
            background: var(--bg-color);
        }

        .km-empty {
            color: var(--muted-color);
            font-size: 12px;
            padding: 4px 0;
        }

        .km-detail-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .km-combo {
            font-weight: 600;
            font-size: 13px;
        }

        .km-field {
            margin-bottom: 9px;
        }

        .km-field label {
            display: block;
            font-size: 11px;
            color: var(--muted-color);
            margin-bottom: 3px;
        }

        .km-field input[type="text"],
        .km-field select,
        .km-field textarea {
            width: 100%;
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 5px 8px;
            font-size: 12px;
            font-family: inherit;
        }

        .km-field textarea {
            font-family: Menlo, monospace;
            font-size: 11px;
            resize: vertical;
            min-height: 46px;
        }

        .km-field input:focus,
        .km-field select:focus,
        .km-field textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .km-cols {
            display: flex;
            gap: 10px;
        }

        .km-cols > * {
            flex: 1 1 0;
            min-width: 0;
        }

        .km-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .km-note {
            font-size: 11px;
            color: var(--muted-color);
            background: var(--input-bg);
            border-left: 2px solid var(--border-color);
            padding: 6px 9px;
            margin-bottom: 9px;
            line-height: 1.4;
        }

        .km-note.km-note-error {
            border-left-color: #d9534f;
            color: #e57373;
        }

        .km-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 11px;
        }

        .km-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 6px 14px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }

        .km-btn:hover {
            background: var(--hover-color);
        }

        .km-btn.km-primary {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .km-btn.km-primary:hover {
            background: var(--accent-hover);
        }

        .km-btn.km-danger:hover {
            background: #5a2020;
            border-color: #d9534f;
        }

        .km-status {
            font-size: 11px;
            color: var(--muted-color);
            margin-left: auto;
        }

        /* ── editor: hints, argument rows, action-param widgets ─────────── */
        .km-hint {
            font-size: 11px;
            color: var(--muted-color);
            margin: -5px 0 9px;
            line-height: 1.4;
        }

        .km-hint:empty { display: none; }
        .km-hint-warn { color: #e5a33a; }

        .km-args { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
        .km-arg-row { display: flex; gap: 5px; }
        .km-arg-row .km-arg { flex: 1 1 auto; }
        .km-arg-drop { flex: 0 0 auto; padding: 5px 11px; line-height: 1; font-size: 14px; }
        .km-arg-add { padding: 5px 11px; font-size: 11px; }

        /* param_widgets.js wraps each param in .form-group and ships no styles
           of its own, so the host page dresses them. */
        .km-params .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .km-params .form-group label {
            font-size: 11px;
            color: var(--muted-color);
        }

        .km-params input,
        .km-params select,
        .km-params textarea {
            width: 100%;
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 5px 8px;
            font-family: Menlo, monospace;
            font-size: 11px;
        }

        .km-params textarea { min-height: 52px; resize: vertical; }

        .km-params input:focus,
        .km-params select:focus,
        .km-params textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .km-params .browse-btn {
            align-self: flex-start;
            width: auto;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 5px 11px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }

        .km-copy { max-width: 200px; }
        .km-free-count { font-size: 9px; opacity: 0.62; }

        .km-theme {
            flex: 0 0 auto;
            min-width: 150px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 4px 8px;
            font-family: inherit;
            font-size: 11px;
            max-width: 180px;
        }

        .km-hide {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="km-app">
    <div class="km-header">
        <span class="km-title">⌘ Keymap</span>
        <input type="text" id="km-search" class="km-search" placeholder="Filter by description, key or function…">
        <select id="km-theme" class="km-theme" aria-label="Colour theme"></select>
        <span class="km-stats" id="km-stats"></span>
    </div>

    <div class="km-layers" id="km-layers"></div>

    <div class="km-board" id="km-board"></div>

    <div class="km-detail" id="km-detail">
        <div class="km-empty">Select a key to see or change what it does.</div>
    </div>
</div>

<script src="param_widgets.js"></script>
<script src="keymap_themes.js"></script>
<script src="keymap_theme.js"></script>
<script src="keymap_transport_hs.js"></script>
<script src="keymap.js"></script>
</body>
</html>
