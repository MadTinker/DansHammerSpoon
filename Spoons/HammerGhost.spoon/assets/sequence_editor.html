<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sequence Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="sequence-editor">
        <h2>Sequence Editor</h2>
        <div id="sequence-steps">
            <!-- Sequence steps will be populated here -->
        </div>
        <div class="form-buttons">
            <button type="button" id="add-action-step" class="primary">Add Action</button>
            <button type="button" id="add-condition-step" class="primary">Add Condition</button>
            <button type="button" id="save-sequence">Save Sequence</button>
            <button type="button" id="cancel-sequence">Cancel</button>
        </div>
    </div>
    <script src="sequence_editor.js"></script>
</body>
</html>
