<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="pf-bar">
    <button id="pf-open">Open .pcfg…</button>
    <span id="pf-path" class="pf-path">No file loaded</span>
    <span class="pf-spacer"></span>
    <button id="pf-reveal" disabled>Reveal in Finder</button>
    <button id="pf-reload" disabled>Reload</button>
  </div>

  <div id="pf-tabs" class="pf-tabs"></div>

  <div id="pf-grid" class="pf-grid"></div>

  <div id="pf-editor" class="pf-editor" hidden></div>

  <div class="pf-status" id="pf-status">Pick an exported .pcfg to begin.</div>

  <script src="padforge.js"></script>
</body>
</html>
